<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top-Down RPG</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- ── SPLASH SCREEN ─────────────────────────── -->
    <div id="splash-screen">
      <div id="splash-title">HeroPix</div>
      <button id="splash-start-btn">▶ START GAME</button>
    </div>
    <!-- ── LOBBY SCREEN ─────────────────────────── -->
    <div id="start-screen" class="lobby-screen" style="display: none;">
      <div class="lobby-panel">
        <div class="lobby-header">
          <span class="lobby-logo">HeroPix</span>
          <span class="lobby-subtitle">MULTIPLAYER</span>
        </div>
        <div class="lobby-body">
          <!-- Username -->
          <div class="lobby-field">
            <label for="mp-name">USERNAME</label>
            <input type="text" id="mp-name" value="Player" maxlength="16" autocomplete="off" />
          </div>
          <!-- Actions -->
          <div class="lobby-actions">
            <button id="mp-btn-create" class="lbtn lbtn-create">🎮 CREATE ROOM</button>
            <div class="lobby-or"><span>OR</span></div>
            <div class="lobby-join-row">
              <input type="number" id="mp-room-id" placeholder="Room Code" />
              <button id="mp-btn-join" class="lbtn lbtn-join">JOIN</button>
            </div>
          </div>
          <div id="mp-error" class="error-msg" style="display: none;"></div>
        </div>
      </div>
    </div>
    
    <div id="selection-screen" style="display: none;">
      <!-- DRAFT PICK LAYOUT -->

      <!-- LEFT: Player List -->
      <div class="dp-left">
        <div class="dp-room-code">ROOM <span id="lobby-room-id">----</span></div>
        <div class="dp-player-label">PLAYERS</div>
        <div id="lobby-player-list" class="dp-player-list">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- CENTER: Hero Info + Stats -->
      <div class="dp-center">
        <div class="dp-hero-info" style="margin-top: auto; margin-bottom: auto; padding: 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; border-radius: 8px;">
          <div class="dp-hero-name-row" style="margin-bottom: 10px;">
            <span id="detail-name" style="font-size: 32px;">-</span>
            <span id="detail-role" class="dp-role-badge">-</span>
          </div>
          
          <div id="detail-desc" style="color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5;">
            <!-- Description goes here -->
          </div>

          <div class="dp-stats">
            <div class="dp-stat-row">
              <span class="dp-stat-label">HP</span>
              <div class="dp-bar-bg"><div id="bar-hp" class="dp-bar dp-bar-hp"></div></div>
              <span id="txt-hp" class="dp-stat-val">-</span>
            </div>
            <div class="dp-stat-row" id="row-atk">
              <span class="dp-stat-label">ATK</span>
              <div class="dp-bar-bg"><div id="bar-atk" class="dp-bar dp-bar-atk"></div></div>
              <span id="txt-atk" class="dp-stat-val">-</span>
            </div>
            <div class="dp-stat-row">
              <span class="dp-stat-label">SPD</span>
              <div class="dp-bar-bg"><div id="bar-spd" class="dp-bar dp-bar-spd"></div></div>
              <span id="txt-spd" class="dp-stat-val">-</span>
            </div>
          </div>
        </div>

        <div style="height: 20px;"></div>
        <button id="select-hero-btn" class="dp-confirm-btn">CONFIRM</button>
      </div>

      <!-- RIGHT: Role Tabs + Hero Grid -->
      <div class="dp-right">
        <div class="dp-role-tabs">
          <button class="role-tab active" data-role="all">All</button>
          <button class="role-tab" data-role="Tank">Tank</button>
          <button class="role-tab" data-role="Fighter">Fighter</button>
          <button class="role-tab" data-role="Assassin">Assassin</button>
          <button class="role-tab" data-role="Marksman">Marksman</button>
          <button class="role-tab" data-role="Mage">Mage</button>
          <button class="role-tab" data-role="Support">Support</button>
        </div>
        <div class="dp-grid-scroll">
          <div id="hero-grid" class="dp-hero-grid">
            <!-- populated by JS -->
          </div>
        </div>
      </div>
    </div>

    <div id="respawn-overlay" style="display: none;" class="respawn-overlay">
      <div class="respawn-simple-text">
        Respawning in <span id="respawn-timer">5</span>s
      </div>
    </div>

    <!-- Mission Complete Banner (slim top bar) -->
    <!-- <div id="mission-complete-overlay" style="display: none;" class="mission-banner">
      <div class="mission-banner-inner">
        <span class="mission-banner-icon">✅</span>
        <span id="mission-sub-text" class="mission-banner-text">LEVEL 1 CLEARED!</span>
      </div>
    </div> -->

    <!-- Wave HUD (top center) -->
    <div id="wave-hud" style="display: none;" class="wave-hud">
      <div id="wave-hud-text" class="wave-hud-text">WAVE 1 / 3</div>
    </div>

    <!-- New Wave Announcement (center) -->
    <div id="wave-announce" style="display: none;" class="wave-announce">
      <div id="wave-announce-text" class="wave-announce-text">WAVE 1</div>
    </div>

    <!-- Map Announcement Banner (center) -->
    <div id="map-announce" style="display: none;" class="map-announce-overlay">
      <div class="map-announce-subtitle">NOW ENTERING</div>
      <div id="map-announce-title" class="map-announce-title">DUNGEON DEPTHS</div>
    </div>

    <!-- Waiting for Players Overlay -->
    <div id="waiting-overlay" style="display: none;" class="mission-complete-overlay">
      <div class="mission-complete-modal">
        <div class="mission-sub" style="font-size: 24px; letter-spacing: 2px;">WAITING FOR OTHER PLAYERS...</div>
      </div>
    </div>

    <!-- Virtual Controls Overlay -->
    <div id="virtual-controls" style="display: none;">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
      <div id="action-buttons">
        <button id="btn-attack" class="action-btn-v">A</button>
        <button id="btn-skill" class="action-btn-v">B</button>
      </div>
    </div>

    <!-- Map Loading Overlay -->
    <div id="map-loading-overlay" style="display: none;" class="map-loading-overlay">
      <div class="map-loading-modal">
        <div class="map-loading-title">LOADING MAP</div>
        <div class="map-loading-bar-bg"><div id="map-loading-bar" class="map-loading-bar"></div></div>
        <div class="map-loading-text" id="map-loading-text">0%</div>
      </div>
    </div>

    <div id="game-container"></div>
    
    <!-- HTML Name Tags Overlay -->
    <div id="html-name-tags" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden;"></div>

    <!-- HTML Minimap Overlay -->
    <div id="html-minimap" style="display: none;">
      <div id="minimap-bg"></div>
      <div id="minimap-entities"></div>
    </div>

    <!-- Ping Display -->
    <div id="ping-display" style="display: none;">
      <span id="ping-dot" class="ping-dot"></span>
      <span id="ping-value">-- ms</span>
    </div>

    <!-- In-Game Gear Button -->
    <button id="ingame-gear-btn" style="display: none;" title="Settings">
      ⚙
    </button>

    <!-- In-Game Settings Menu -->
    <div id="ingame-settings-menu" style="display: none;">
      <div class="settings-modal">
        <div class="settings-title">⚙ SETTINGS</div>
        <button class="settings-item" id="settings-back-lobby">🔄 Pilih Karakter Ulang</button>
        <button class="settings-item settings-exit" id="settings-exit-game">🚪 Keluar Game</button>
        <button class="settings-item settings-cancel" id="settings-cancel">✕ Tutup</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
